[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trialcheck"
version = "0.2.0"
description = "Platform-agnostic A/B experiment readout auditor with SRM, peeking, MDE, practical significance, Welch t-test, guardrail, and pre-period balance checks."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sidharth Kriplani"}]
keywords = ["ab-testing", "experimentation", "srm", "analytics", "data-science", "experiment-audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SidharthKriplani/trialcheck"
Documentation = "https://github.com/SidharthKriplani/trialcheck#readme"

[project.scripts]
trialcheck-demo = "trialcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
